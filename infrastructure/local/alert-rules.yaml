# Karamchari Prometheus alerting rules.
# Metric names originate from OTel instruments (dots) and are normalized by the
# collector's Prometheus exporter to underscores; counters gain a _total suffix.
# Sources: Karamchari.Core TenantMetricsCollector, ASP.NET Core http.server.* instruments.
groups:
  - name: karamchari-platform
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.instance }} is down"
          description: "Prometheus has been unable to scrape {{ $labels.job }} for 2 minutes."

      - alert: HighHttpErrorRate
        expr: |
          sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
            /
          sum(rate(http_server_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx error rate above 5%"
          description: "More than 5% of requests returned 5xx over the last 5 minutes."

      - alert: HighHttpLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "HTTP p95 latency above 2s"
          description: "95th percentile request duration exceeded 2 seconds for 10 minutes."

  - name: karamchari-eventing
    rules:
      - alert: DeadLetteredEvents
        expr: increase(tenant_event_dlq_count_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Events are being dead-lettered"
          description: "tenant.event.dlq.count increased in the last 15 minutes. Inspect the DLQ and consumer logs."

      - alert: EventRejections
        expr: increase(tenant_event_rejection_count_total[15m]) > 10
        labels:
          severity: warning
        annotations:
          summary: "Event rejections climbing"
          description: "More than 10 event rejections in 15 minutes."

      - alert: ProjectionLagHigh
        expr: projection_lag_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Projection lag above 5 minutes"
          description: "projection.lag.seconds exceeded 300 for 5 minutes; read models are stale."

      - alert: ProjectionLagEventsBacklog
        expr: projection_lag_events > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Projection event backlog above 1000"
          description: "projection.lag.events exceeded 1000 for 10 minutes."

  - name: karamchari-tenancy
    rules:
      - alert: TenantIsolationViolation
        expr: increase(tenant_isolation_violation_count_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Tenant isolation violation detected"
          description: "tenant.isolation.violation.count increased. Treat as a security incident; see docs/operations runbooks."

      - alert: WorkflowSlaBreaches
        expr: increase(workflow_sla_breach_count_total[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Workflow SLA breaches occurring"
          description: "workflow.sla.breach.count increased in the last 30 minutes."

      - alert: WorkflowTransitionFailures
        expr: increase(workflow_transition_failure_count_total[15m]) > 5
        labels:
          severity: warning
        annotations:
          summary: "Workflow transition failures climbing"
          description: "More than 5 workflow transition failures in 15 minutes."
