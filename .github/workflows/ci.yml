name: Enterprise Build and Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CI: true
  # Line-coverage floor (percent). Ratchet upward as coverage improves; never lower
  # without an ADR. Measured baseline on 2026-06-10 was 15.2% line coverage
  # (47 assemblies, 125,625 coverable lines), so the floor starts just below that.
  COVERAGE_FLOOR: "14"

jobs:
  backend:
    name: Backend Restore, Build, Test, Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.203
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/packages.lock.json

      - name: Restore locked dependency graph
        run: dotnet restore src/Backend/Karamchari.sln --locked-mode

      - name: Verify formatting
        run: dotnet format src/Backend/Karamchari.sln --verify-no-changes --severity warn --no-restore

      - name: Verify copyright headers
        run: pwsh scripts/verify-copyright.ps1

      - name: Build with analyzers and warnings as errors
        run: dotnet build src/Backend/Karamchari.sln --no-restore -c Release -warnaserror

      # Architecture tests run WITHOUT coverage: Coverlet's "XPlat Code Coverage"
      # instrumentation injects Tracker types that make NetArchTest throw
      # TypeLoadException (reflects over all types), causing false failures.
      - name: Run tests with coverage (excluding ArchitectureTests)
        run: dotnet test src/Backend/Karamchari.sln --no-build -c Release --filter "FullyQualifiedName!~ArchitectureTests" --logger "trx;LogFilePrefix=test_results" --collect:"XPlat Code Coverage"

      - name: Run ArchitectureTests (no coverage instrumentation)
        run: dotnet test tests/Backend/Karamchari.ArchitectureTests/Karamchari.ArchitectureTests.csproj --no-build -c Release --logger "trx;LogFilePrefix=arch_results"

      - name: Run Tenant Isolation Certification (P0 Isolation Gate)
        run: dotnet test tests/Backend/Karamchari.TenantIsolationCertification/Karamchari.TenantIsolationCertification.csproj --no-build -c Release --logger "trx;LogFilePrefix=isolation_results"

      # Merges per-project cobertura files and fails the build when overall line
      # coverage drops below COVERAGE_FLOOR. ArchitectureTests and the isolation
      # certification run uninstrumented, so they contribute no coverage data.
      - name: Enforce line coverage floor
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"**/TestResults/**/coverage.cobertura.xml" \
            -targetdir:artifacts/coverage-report \
            -reporttypes:"Cobertura;TextSummary"
          actual=$(sed -n 's/.*Line coverage:[[:space:]]*\([0-9.]*\)%.*/\1/p' artifacts/coverage-report/Summary.txt)
          echo "Line coverage: ${actual}% (floor: ${COVERAGE_FLOOR}%)"
          if ! awk -v a="$actual" -v f="$COVERAGE_FLOOR" 'BEGIN { exit (a+0 >= f+0) ? 0 : 1 }'; then
            echo "::error::Line coverage ${actual}% is below the ${COVERAGE_FLOOR}% floor"
            exit 1
          fi

      - name: NuGet vulnerability audit
        run: dotnet list src/Backend/Karamchari.sln package --vulnerable --include-transitive

      - name: Publish API validation
        run: dotnet publish src/Backend/Karamchari.Api/Karamchari.Api.csproj --no-restore -c Release -o artifacts/publish/Karamchari.Api -warnaserror

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
            artifacts/coverage-report/**
          retention-days: 14

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: karamchari-api-publish
          path: artifacts/publish/Karamchari.Api
          retention-days: 14

  node:
    name: Frontend and Mobile Dependency Governance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/Frontend/portal/package-lock.json
            src/Mobile/karamchari-mobile/package-lock.json

      - name: Portal deterministic install
        run: npm ci --ignore-scripts --loglevel=error
        working-directory: src/Frontend/portal

      - name: Portal audit
        run: npm audit --audit-level=moderate
        working-directory: src/Frontend/portal

      - name: Portal typecheck
        run: npm run typecheck
        working-directory: src/Frontend/portal

      - name: Portal build
        run: npm run build
        working-directory: src/Frontend/portal
        env:
          # Next.js prerenders /admin/* at build. config.ts requireEnv throws in
          # production builds when any NEXT_PUBLIC_* is unset, so provide all three.
          # Use the secret when configured, otherwise a CI-only default.
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:5000' }}
          NEXT_PUBLIC_DEFAULT_TENANT_ID: ${{ secrets.NEXT_PUBLIC_DEFAULT_TENANT_ID || 'sch_oakridge' }}
          NEXT_PUBLIC_GATEWAY_FINGERPRINT: ${{ secrets.NEXT_PUBLIC_GATEWAY_FINGERPRINT || 'local-dev-gateway' }}

      - name: Mobile deterministic install
        run: npm ci --ignore-scripts --loglevel=error
        working-directory: src/Mobile/karamchari-mobile

      - name: Mobile audit
        run: npm audit --audit-level=moderate
        working-directory: src/Mobile/karamchari-mobile

  security:
    name: Secret and Repository Hygiene Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: trufflesecurity/trufflehog@v3.89.2
        with:
          path: ./
          # On PRs scan the PR diff; on push to main scan the pushed range.
          # Using default_branch..HEAD made base==head on push to main, which
          # TruffleHog rejects ("BASE and HEAD commits are the same").
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.event.after }}
          extra_args: --only-verified
