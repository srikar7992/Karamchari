name: Enterprise Build and Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CI: true

jobs:
  backend:
    name: Backend Restore, Build, Test, Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.203
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/packages.lock.json

      - name: Restore locked dependency graph
        run: dotnet restore src/Backend/Karamchari.sln --locked-mode

      - name: Verify formatting
        run: dotnet format src/Backend/Karamchari.sln --verify-no-changes --severity warn --no-restore

      - name: Build with analyzers and warnings as errors
        run: dotnet build src/Backend/Karamchari.sln --no-restore -c Release -warnaserror

      - name: Run tests with coverage
        run: dotnet test src/Backend/Karamchari.sln --no-build -c Release --logger "trx;LogFilePrefix=test_results" --collect:"XPlat Code Coverage"

      - name: NuGet vulnerability audit
        run: dotnet list src/Backend/Karamchari.sln package --vulnerable --include-transitive

      - name: Publish API validation
        run: dotnet publish src/Backend/Karamchari.Api/Karamchari.Api.csproj --no-restore -c Release -o artifacts/publish/Karamchari.Api -warnaserror

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          retention-days: 14

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: karamchari-api-publish
          path: artifacts/publish/Karamchari.Api
          retention-days: 14

  node:
    name: Frontend and Mobile Dependency Governance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/Frontend/portal/package-lock.json
            src/Mobile/karamchari-mobile/package-lock.json

      - name: Portal deterministic install
        run: npm ci --ignore-scripts --loglevel=error
        working-directory: src/Frontend/portal

      - name: Portal audit
        run: npm audit --audit-level=moderate
        working-directory: src/Frontend/portal

      - name: Portal typecheck
        run: npm run typecheck
        working-directory: src/Frontend/portal

      - name: Portal build
        run: npm run build
        working-directory: src/Frontend/portal

      - name: Mobile deterministic install
        run: npm ci --ignore-scripts --loglevel=error
        working-directory: src/Mobile/karamchari-mobile

      - name: Mobile audit
        run: npm audit --audit-level=moderate
        working-directory: src/Mobile/karamchari-mobile

  security:
    name: Secret and Repository Hygiene Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: trufflesecurity/trufflehog@v3.89.2
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
