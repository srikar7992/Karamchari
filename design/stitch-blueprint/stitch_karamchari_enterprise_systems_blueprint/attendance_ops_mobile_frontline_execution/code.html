<style>
        /* Base styles from guidance */
        body {
            background-color: #fcf8f8; /* background */
            color: #1c1b1c; /* on-background */
            font-family: "Geist", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Structural Hairlines */
        .hairline-b { border-bottom: 1px solid rgba(14,15,18,0.12); }
        .hairline-t { border-top: 1px solid rgba(14,15,18,0.12); }
        .hairline-r { border-right: 1px solid rgba(14,15,18,0.12); }
        .hairline-l { border-left: 1px solid rgba(14,15,18,0.12); }
        .hairline-all { border: 1px solid rgba(14,15,18,0.12); }
        
        /* Corner Ticks */
        .corner-tick-tl::before {
            content: ''; position: absolute; top: 0; left: 0; width: 8px; height: 8px;
            border-top: 1px solid #1c1b1c; border-left: 1px solid #1c1b1c;
        }
        .corner-tick-tr::after {
            content: ''; position: absolute; top: 0; right: 0; width: 8px; height: 8px;
            border-top: 1px solid #1c1b1c; border-right: 1px solid #1c1b1c;
        }
        .corner-tick-bl::before {
            content: ''; position: absolute; bottom: 0; left: 0; width: 8px; height: 8px;
            border-bottom: 1px solid #1c1b1c; border-left: 1px solid #1c1b1c;
        }
        .corner-tick-br::after {
            content: ''; position: absolute; bottom: 0; right: 0; width: 8px; height: 8px;
            border-bottom: 1px solid #1c1b1c; border-right: 1px solid #1c1b1c;
        }

        /* Bindu Indicator */
        .bindu {
            width: 8px; height: 8px; border-radius: 50%; display: inline-block;
        }
        
        /* Specific animations */
        @keyframes pulse-tamra {
            0% { box-shadow: 0 0 0 0 rgba(177, 106, 60, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(177, 106, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(177, 106, 60, 0); }
        }
        .pulse-active {
            animation: pulse-tamra 2s infinite;
        }

        /* Tonal Wash Gradient (Allowed minimal depth) */
        .tonal-wash {
            background: linear-gradient(184deg, #fcf8f8 0%, #f4f0ef 100%);
        }
    </style>

<script>
        // Simple timer increment logic
        const timerElement = document.getElementById('shift-timer');
        let totalSeconds = (4 * 3600) + (22 * 60) + 15; // Starting at 04:22:15

        setInterval(() => {
            totalSeconds++;
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            
            const formattedTime = 
                String(hours).padStart(2, '0') + ':' + 
                String(minutes).padStart(2, '0') + ':' + 
                String(seconds).padStart(2, '0');
                
            if(timerElement) timerElement.textContent = formattedTime;
        }, 1000);
    </script>
