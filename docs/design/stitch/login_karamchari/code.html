<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-md antialiased selection:bg-primary selection:text-on-primary">
<!-- Main Container - Focused Transactional Layout -->
<main class="w-full max-w-[400px]">
<!-- Subtle Brand Anchor -->
<div class="mb-xl flex justify-center">
<div class="h-8 w-8 bg-primary rounded-DEFAULT flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-xl" style="font-variation-settings: 'FILL' 1;">
                    bolt
                </span>
</div>
</div>
<!-- Central Card -->
<div class="bg-surface-container-low border border-[rgba(255,255,255,0.1)] rounded-DEFAULT p-xl flex flex-col gap-xl">
<!-- Header -->
<div class="flex flex-col gap-sm text-center">
<h1 class="font-h2 text-h2 text-primary">Sign in to Karamchari</h1>
<p class="font-body-base text-body-base text-on-surface-variant">Enterprise resource management.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-lg">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest" for="email">Email Address</label>
<input class="w-full bg-background border border-[rgba(255,255,255,0.1)] rounded-DEFAULT px-md py-[10px] font-body-base text-body-base text-primary placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
<button class="w-full bg-primary text-on-primary font-body-base text-body-base font-medium py-[10px] px-md rounded-DEFAULT hover:bg-tertiary-container transition-colors flex items-center justify-center gap-sm mt-sm" type="submit">
                    Continue with SSO
                    <span class="material-symbols-outlined text-[18px]">
                        arrow_forward
                    </span>
</button>
</form>
<!-- Contextual Link -->
<div class="text-center mt-[-0.5rem]">
<a class="font-body-base text-body-base text-on-surface-variant hover:text-primary transition-colors" href="#">
                    Need help logging in?
                </a>
</div>
</div>
</main>
